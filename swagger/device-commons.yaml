openapi: 3.0.3
info:
  title: Smart Home SDK - common models
  description: Smart Home SDK - common models
  version: 1.0.0

paths: {}

components:
  schemas:
    SmartVendor:
      type: string
      enum:
        - "shelly"
        - "eaton"
        - "other"
    SmartDeviceType:
      type: string
      description: >-
        The type of a device in the Eaton configuration - the vocabulary of EatonDeviceConfiguration
        and EatonConfigurationResponse, which amx-service reads a datagram by. Not the kind of a
        device of the registry: that is DeviceKind, with a LightKind for how a light is driven
        (a `dimmer` here is a `light` that dims there). A new reader of devices uses the
        registry models; these stay for the lookup amx-service makes.
      enum:
        - "temperature sensor"
        - "blinds"
        - "light"
        - "dimmer"
        - "other"


# not used yet

    DeviceConfiguration:
      type: object
      properties:
        eatonConfiguration:
          $ref: '#/components/schemas/EatonConfiguration'
        shellyConfiguration:
          $ref: '#/components/schemas/ShellyConfiguration'
    DeviceConfigurationRequest:
      type: object
      required:
        - roomName
        - iotVendor
        - deviceConfiguration
      properties:
        roomName:
          type: string
          minLength: 3
          maxLength: 20
          nullable: false
          x-field-extra-annotation: "@NotEmpty"
        iotVendor:
          type: string
          minLength: 3
          maxLength: 20
        deviceType:
          type: string
          minLength: 3
          maxLength: 20
        deviceConfiguration:
          $ref: '#/components/schemas/DeviceConfiguration'
