openapi: 3.0.3
info:
  title: Household notifications
  description: What the household is told about the house, as it travels to notification-service
  version: 1.0.0

paths: {}

components:
  schemas:
    HouseholdNotification:
      type: object
      description: >-
        The payload of the `household` category of the notification exchange (since 1.13.0) -
        JSON, not plain text like `alert` and `info`. It says what happened and to which device;
        notification-service composes the words from the event, in Polish, and sends them to the
        household's Discord channel, by SMS and by Web Push. No text travels in the payload.
      required:
        - event
        - subject
        - deviceId
        - occurredAt
        - reminder
      properties:
        event:
          $ref: '#/components/schemas/HouseholdEvent'
        subject:
          type: string
          description: The name of the device as the registry has it - what the household calls it
          minLength: 3
          maxLength: 50
          example: 'Zmywarka'
        deviceId:
          type: integer
          format: int64
          description: The id of the device in the registry
          minimum: 1
        occurredAt:
          type: string
          format: date-time
          description: When it happened, in the local time of the house
        reminder:
          type: integer
          description: >-
            How many reminders came before this message: 0 for `appliance finished`, 1 for the
            first `appliance reminder`, and for `appliance acknowledged` the number that had
            been sent.
          minimum: 0
          maximum: 10
        acknowledgePath:
          type: string
          description: >-
            The path of the application where the household acknowledges it, linked from the
            message; left out when there is nothing to acknowledge. A path of the application
            only - no host, no `//`, no query.
          maxLength: 200
          pattern: ^(/[A-Za-z0-9_-]+)+$
          example: '/room'
        member:
          type: string
          description: >-
            The household member who did it, by their name in the household registry (since 1.14.0)
            - for `appliance acknowledged`, who acknowledged it in the application; left out when
            nobody is known. Information for the message, not a proof of who did the chore.
          minLength: 3
          maxLength: 50
          example: 'Anna'

    HouseholdEvent:
      type: string
      description: >-
        What the household is told. The constant names are what the publishers and
        notification-service share; a new one is read by notification-service before anybody
        publishes it.
      enum:
        - "appliance finished"
        - "appliance reminder"
        - "appliance acknowledged"
