openapi: 3.0.3
info:
  title: Household notifications
  description: What the household is told about the house, as it travels to notification-service
  version: 1.0.0

paths: {}

components:
  schemas:
    HouseholdNotification:
      type: object
      description: >-
        The payload of the `household` category of the notification exchange (since 1.13.0) -
        JSON, not plain text like `alert` and `info`. It says what happened and to which device;
        notification-service composes the words from the event, in Polish, and sends them to the
        household's Discord channel, by SMS and by Web Push. No text travels in the payload.
      required:
        - event
        - subject
        - deviceId
        - occurredAt
        - reminder
      properties:
        event:
          $ref: '#/components/schemas/HouseholdEvent'
        subject:
          type: string
          description: The name of the device as the registry has it - what the household calls it
          minLength: 3
          maxLength: 50
          example: 'Zmywarka'
        deviceId:
          type: integer
          format: int64
          description: The id of the device in the registry
          minimum: 1
        occurredAt:
          type: string
          format: date-time
          description: When it happened, in the local time of the house
        reminder:
          type: integer
          description: >-
            How many reminders came before this message: 0 for `appliance finished`, 1 for the
            first `appliance reminder`, and for `appliance acknowledged` the number that had
            been sent. For a `garage gate open ...` event 0 is the first message and 1 its first repeat.
          minimum: 0
          maximum: 10
        acknowledgePath:
          type: string
          description: >-
            The path of the application where the household acknowledges it, linked from the
            message; left out when there is nothing to acknowledge. A path of the application
            only - no host, no `//`, no query.
          maxLength: 200
          pattern: ^(/[A-Za-z0-9_-]+)+$
          example: '/room'
        member:
          type: string
          description: >-
            The household member who did it, by their name in the household registry (since 1.14.0)
            - for `appliance acknowledged`, who acknowledged it in the application; left out when
            nobody is known. Information for the message, not a proof of who did the chore.
          minLength: 3
          maxLength: 50
          example: 'Anna'
        pm10:
          type: integer
          description: >-
            The PM10 of the air outside the house in ug/m3 (since 1.21.0) - for `smog warning` the reading that
            opened the episode, for `smog over` the one that closed it; left out for every other event.
          minimum: 0
          example: 112
        pm25:
          type: integer
          description: >-
            The PM2.5 of the air outside the house in ug/m3 (since 1.21.0), as pm10; left out for every other event.
          minimum: 0
          example: 78
        source:
          $ref: '#/components/schemas/GateOpenSource'
        openSince:
          type: string
          format: date-time
          description: >-
            Since when the garage gate is open, in the local time of the house (since 1.23.0) - for the three
            `garage gate open ...` events and for `garage gate closed` (how long it stood open is told from it and
            `occurredAt`); left out for every other event.
        temperature:
          type: number
          format: double
          description: >-
            The temperature outside the house in degrees Celsius (since 1.23.0) - for `garage gate open cold` the
            reading that made it an alarm; left out for every other event.
          minimum: -60
          maximum: 60
          example: 7.5
        room:
          $ref: './home.yaml#/components/schemas/RoomName'

    HouseholdEvent:
      type: string
      description: >-
        What the household is told. The constant names are what the publishers and
        notification-service share; a new one is read by notification-service before anybody
        publishes it. `smog warning` and `smog over` (since 1.21.0) are the start and the end of an episode
        of bad air outside the house, published by weather-service - the subject is the air quality sensor.
        `doorbell ringing` and `gate opened` (since 1.22.0) are a ring at the gate and an opening of the gate,
        published by gate-service - the subject of a ring is the `intercom`, of an opening the `gate` of the
        registry; an opening carries its `source`, and `member` when it was opened from the dashboard.
        The four `garage gate ...` events (since 1.23.0) are published by gate-service about a garage gate of the
        registry - a `gate` with `openingSensors`, the subject: `garage gate open cold` (an alarm - it stands open
        while it is cold outside, with `temperature`), `garage gate open empty house` (an alarm - it stands open
        while nobody is at home), `garage gate open long` (a warning - it stands open for long) and
        `garage gate closed` (the end of any of them). The three open ones carry `openSince` and count their
        repeats in `reminder`, 0 for the first. `fire alarm` and `fire alarm over` (since 1.24.0) are the
        start and the end of an alarm of a smoke, CO or heat detector, published by safety-service - the
        subject is the detector, and `room` names its room so that notification-service words it without
        reading the registry.
      enum:
        - "appliance finished"
        - "appliance reminder"
        - "appliance acknowledged"
        - "smog warning"
        - "smog over"
        - "doorbell ringing"
        - "gate opened"
        - "garage gate open cold"
        - "garage gate open empty house"
        - "garage gate open long"
        - "garage gate closed"
        - "fire alarm"
        - "fire alarm over"

    GateOpenSource:
      type: string
      description: >-
        Where the gate was opened from (since 1.22.0), carried by `gate opened` and left out for every other
        event: `screen` - the button of the indoor screen of the intercom, `dashboard` - the application, by
        the member it names, `panel` - the entrance panel at the door (since 1.25.0, HAS-480). The constant names are what gate-service and notification-service share; a new
        one is read by notification-service before anybody publishes it.
      enum:
        - "screen"
        - "dashboard"
        - "panel"
