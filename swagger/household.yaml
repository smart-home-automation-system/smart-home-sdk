openapi: 3.0.3
info:
  title: Households
  description: Model used to represent a household
  version: 1.0.0

paths: {}
  
components:
  schemas: 
    HouseholdMember:
      type: object
      required: 
        - name
        - phone
        - active
      properties: 
        name:
          type: string
          description: The name of the household member
          minLength: 3
          maxLength: 50
        phone:
          type: string
          description: >-
            The phone number of the household member in the international E.164 format - a plus,
            the country code and the subscriber number, no spaces or dashes (e.g. +48505602702).
            It is used as an SMS recipient; formatting for display is up to the client.
          format: phone
          maxLength: 16
          pattern: ^\+[1-9][0-9]{7,14}$
          example: '+48505602702'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/MemberPhoneDetails'
        active:
          type: boolean
          description: Whether the household member is active or not
          default: true
        role:
          $ref: '#/components/schemas/MemberRole'
        rooms:
          type: array
          description: >-
            The rooms of the household member - what the dashboard shows them as their own. A
            member can have several (e.g. office and sanctum) or none; a room is listed once.
          uniqueItems: true
          items:
            $ref: './home.yaml#/components/schemas/RoomName'
    MemberRole:
      type: string
      description: >-
        What the household member may do in the dashboard: an admin manages the whole house, a
        resident sees their own rooms. A member stored without a role is a resident.
      enum:
        - admin
        - resident
      default: resident
    MemberPhoneDetails:
      type: object
      required: 
        - name
        - mac
      properties: 
        name:
          type: string
          description: The name of the device
          maxLength: 50
        mac:
          type: string
          description: The MAC address of the device, lowercase and colon separated as reported by UniFi
          format: mac
          pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
