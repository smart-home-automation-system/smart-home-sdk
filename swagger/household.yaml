openapi: 3.0.3
info:
  title: Households
  description: Model used to represent a household
  version: 1.0.0

paths: {}
  
components:
  schemas: 
    HouseholdMember:
      type: object
      required: 
        - name
        - phone
        - active
      properties: 
        name:
          type: string
          description: The name of the household member
          minLength: 3
          maxLength: 50
        phone:
          type: string
          description: >-
            The phone number of the household member in the international E.164 format - a plus,
            the country code and the subscriber number, no spaces or dashes (e.g. +48505602702).
            It is used as an SMS recipient; formatting for display is up to the client.
          format: phone
          maxLength: 16
          pattern: ^\+[1-9][0-9]{7,14}$
          example: '+48505602702'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/MemberPhoneDetails'
        active:
          type: boolean
          description: Whether the household member is active or not
          default: true
        role:
          $ref: '#/components/schemas/MemberRole'
        rooms:
          type: array
          description: >-
            The rooms of the household member - what the dashboard shows them as their own, in
            the order they are to be shown. A member can have several (e.g. office and sanctum)
            or none. A room is listed once; the registry refuses a list that repeats one. (Not
            `uniqueItems`: that would make the model an unordered set.)
          items:
            $ref: './home.yaml#/components/schemas/RoomName'
        permissions:
          type: array
          description: >-
            What the household member may do in the dashboard beyond what their role gives them,
            each permission once; none for most members. Like the rooms it is a plain list that
            the registry checks when it is stored. (Not `uniqueItems`: that would make the model
            an unordered set.)
          items:
            $ref: '#/components/schemas/MemberPermission'
    HouseholdProfile:
      type: object
      description: >-
        What the web dashboard needs to know about a household member to show them their own
        view - the name, the role, the rooms and the permissions - and nothing else. Deliberately without the phone number and the devices of the
        member: this is the model that travels to every browser in the house. There is no
        `active` here either: a profile exists for an active member only, so whoever answers
        with profiles leaves a member who is switched off out of the answer - the model cannot
        say it, and the rule is the producer's to keep (database-service, GET
        /household/profiles).
      required:
        - name
        - role
      properties:
        name:
          type: string
          description: The name of the household member
          minLength: 3
          maxLength: 50
        role:
          $ref: '#/components/schemas/MemberRole'
        rooms:
          type: array
          description: >-
            The rooms of the household member, in the order they are to be shown; none when the
            member has no room. A room is listed once: the registry refuses a list that repeats
            one, or holds a null, when the rooms are stored - this model, like HouseholdMember,
            does not check it. (Not `uniqueItems`: that would make the model an unordered set.)
          items:
            $ref: './home.yaml#/components/schemas/RoomName'
        permissions:
          type: array
          description: >-
            What the household member may do in the dashboard beyond what their role gives them;
            none when the member has no permission of their own. The dashboard offers a control
            behind a permission only to a member who has it.
          items:
            $ref: '#/components/schemas/MemberPermission'
    MemberPermission:
      type: string
      description: >-
        Something a household member may do in the dashboard that their role alone does not
        give them. A permission is granted to one member at a time, in the registry;
        `heating_switch` lets a member switch the heating of the whole house on and off from
        their own page. Like a role it decides what the interface offers - nothing behind the
        gateway checks it. A new permission is a new value here; renaming or removing one needs
        a migration of the rows the registry stores it in.
      enum:
        - heating_switch
    MemberRole:
      type: string
      description: >-
        What the household member may do in the dashboard: an admin manages the whole house, a
        resident sees their own rooms. Deliberately without a default: a payload that leaves the
        role out says "not sent", so the registry can make a new member a resident and leave the
        role of an existing one alone when only something else is updated. The registry always
        answers with a role.
      enum:
        - admin
        - resident
    MemberPhoneDetails:
      type: object
      required: 
        - name
        - mac
      properties: 
        name:
          type: string
          description: The name of the device
          maxLength: 50
        mac:
          type: string
          description: The MAC address of the device, lowercase and colon separated as reported by UniFi
          format: mac
          pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
